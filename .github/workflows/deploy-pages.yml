name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the build job; the deploy job needs to write Pages and
# mint an OIDC token for actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment: let it finish, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend-only bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for GitHub Pages
        # Sets VITE_FORCE_BROWSER_MODE=true and VITE_BASE=/the-test-automation-website/
        run: npm run build:pages
      - name: Add SPA deep-link fallback
        # GitHub Pages serves 404.html for unknown paths; serving the SPA shell
        # there lets react-router handle deep links like /shop/cart.
        run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
